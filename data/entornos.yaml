# Inventario de entornos (AWS, Azure y OpenShift).
#
# Formato de cada entrada:
#   nombre:       obligatorio, único
#   entorno:      obligatorio: cert | pre | pro
#   tipo:         obligatorio: aws | ocp | azure
#   argocd:       URL de Argo CD
#   console:      URL de la consola (solo si tipo es ocp)
#   cuenta:       solo si tipo es aws (12 dígitos, entre comillas)
#                 o azure (ID de suscripción, formato GUID)
#   notas:        texto libre
#   tags:         lista
#   responsable:  persona o equipo (texto)
#   namespace:    lista de namespaces (máximo 20)
#
# Se permiten campos extra: se muestran en la tarjeta y entran en la búsqueda.
#
# ¡NO pongas secretos aquí! (contraseñas, tokens, API keys, claves AKIA...).
# El build falla si detecta algo que lo parezca.
#
# Todos los datos de este fichero son FICTICIOS.


- nombre: Portal Clientes - Certificación
  entorno: cert
  tipo: ocp
  argocd: https://argocd.apps.ocp-cert-mad01.ejemplo.local
  console: https://console-openshift-console.apps.ocp-cert-mad01.ejemplo.local
  notas: Las ventanas de despliegue son martes y jueves de 8:00 a 10:00.
  tags: [portal, clientes, java]
  responsable: Ana Ejemplo
  namespace:
    - acb-portal-front-cert
    - acb-portal-api-cert
    - acb-portal-batch-cert
    - acb-portal-jobs-cert
    - acb-portal-notificaciones-cert

