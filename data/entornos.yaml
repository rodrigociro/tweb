# Inventario de entornos (cuentas AWS y clusters OpenShift).
#
# Obligatorios: nombre, entorno (dev|pre|pro), tipo (aws|openshift)
# Opcionales:   aplicacion, cuenta_aws (entre comillas), region, cluster, api,
#               consola, argocd, namespaces (lista), confluence, notas, tags (lista)
# Se permiten campos extra: se muestran en la tarjeta y entran en la búsqueda.
#
# ¡NO pongas secretos aquí! (contraseñas, tokens, API keys, claves AKIA...).
# El build falla si detecta algo que lo parezca.
#
# Todos los datos de este fichero son FICTICIOS.

